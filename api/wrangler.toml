name = "zenofit-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "zenofit"
database_id = "d74dafe1-35f1-413d-9066-cfde2fc27dd5"

# One Durable Object per scheduled timer. A DO alarm fires at an exact second,
# which a cron trigger cannot do: crons have one-minute resolution and a rest
# timer is 60 to 180 seconds.
[[durable_objects.bindings]]
name = "TIMER"
class_name = "TimerAlarm"

# SQLite-backed, because that is the only kind the free plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TimerAlarm"]

# The daily sweep: a photo nothing has held for the grace period is deleted
# (sweepPhotos in src/photos.js), and so is every rate-limit counter whose
# window ended more than a day ago (sweepLimits in src/limits.js). Minute
# and hour are arbitrary, picked to be nobody's workout.
[triggers]
crons = ["23 3 * * *"]

[vars]
# Browsers that are allowed to call this API. Comma separated, no spaces.
ALLOWED_ORIGINS = "https://kerlitthedog.github.io,http://localhost:8080,http://127.0.0.1:8080"

# Required by the push spec: who to contact if a push service sees a problem
# with our traffic. A mailto: or an https: URL. Apple is the fussiest about it.
VAPID_SUBJECT = "mailto:swagerooner@gmail.com"

# The public half of the VAPID pair. Public by design: the app ships it too.
# The private half lives in a secret (wrangler secret put VAPID_PRIVATE_KEY).
VAPID_PUBLIC_KEY = "BHYPfSTAzNvtQIcnSPN99oHb5YN3FV0W1wJG_VJKQqXngrW8aJ4z8OQPg4vpgWW4MVqt_DtGgv3_I4PDzXlgOMA"

# Ceilings on making identities and on asking about them, per hour. Why
# these numbers: the block above SIGNUP_WINDOW_MS in src/index.js. Read as
# numbers; a missing or broken value falls back to the one in the code, and
# a local test can move one with `wrangler dev --var LIMIT_DEVICES_PER_HOUR:5`.
LIMIT_DEVICES_PER_HOUR = "100"     # POST /v1/devices, per address
LIMIT_REGISTER_PER_HOUR = "100"    # POST /v1/auth/register, per address
LIMIT_AVAILABLE_PER_HOUR = "200"   # GET /v1/auth/available, per address
LIMIT_SEARCH_PER_HOUR = "300"      # GET /v1/users/search, per account
LIMIT_PROFILES_PER_HOUR = "300"    # POST /v1/profiles, per address

# The ceiling on ALL photo data in the database, in characters of data URL:
# 60% of the free plan's 500 MB. Past it an upload is refused (507
# photo_storage_full) and nothing else is. See src/photos.js.
PHOTO_BUDGET_CHARS = "300000000"
