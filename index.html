<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app paint under the notch and the home
       indicator; app.js then measures env(safe-area-inset-*) and hands the
       numbers to the layout, so content stays out from under them (see the
       VIEWPORT ENGINE blocks in app.js and styles.css).

       Do not add `interactive-widget=resizes-content` here. It sounds like
       the fix for the save bar sitting under the on-screen keyboard, and on
       Android it is what stops you typing at all: it makes the keyboard
       resize the *layout* viewport, the frame is 100dvh, and every bottom
       sheet is anchored to the frame's bottom, so opening the keyboard
       teleports the field you just tapped ~455px up the screen and Chrome
       gives up on the IME. The default (resizes-visual) lets the keyboard
       overlay the app instead, and nothing moves. If the save bar has to
       clear the keyboard, do it by measuring visualViewport and lifting
       that one bar, not by resizing the whole app out from under a finger. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Powerbuild Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <!-- Installing to the home screen is what buys the real portrait lock on
       Android (manifest "orientation": "portrait") and what lets iOS deliver
       timer notifications at all. These tags make that install behave. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#131417">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zenofit">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    /* Stamp the saved theme before first paint to avoid a flash of the
       wrong palette. app.js keeps this in sync afterward. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("powerbuild-tracker:v1"));
        var t = s && s.settings && s.settings.theme;
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- Lucide icons (same icon set the JSX prototype used) -->
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <!-- i18n.js first: app.js calls T() while it renders the first frame.
       standards.js is pure data (the strength-standards tables) and is read
       by the Progress tab's second segment, so it has to be in before app.js
       builds a frame too. -->
  <script src="i18n.js"></script>
  <script src="standards.js"></script>
  <!-- Cloud client. Loaded BEFORE app.js so window.ZenofitCloud exists on the
       first frame. It never touches `state` and fails softly when the API is
       unreachable, so the app runs unchanged without it. -->
  <script src="zenofit-cloud.js"></script>
  <script src="app.js"></script>

  <!-- Service worker. Two reasons it exists: the app opens offline, and
       web push (the only way a timer can ring while the app is closed)
       is delivered to a service worker, not to the page.

       The update banner below is not decoration. sw.js serves from cache
       first, so without it a deploy shows the OLD app on the first open and
       the new one only on the second. Bumping VERSION in sw.js is what makes
       a new worker install; this is what tells the user it is waiting. -->
  <script>
  (function () {
    if (!("serviceWorker" in navigator)) return;

    /* Phase 5 will read this: sw.js posts notification clicks here so the app
       can jump to the timer that fired. Queued until app.js claims it. */
    window.__zenofitSW = { pendingClicks: [], onClick: null };
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (!e.data || e.data.type !== "notification-click") return;
      var h = window.__zenofitSW.onClick;
      if (typeof h === "function") h(e.data.data);
      else window.__zenofitSW.pendingClicks.push(e.data.data);
    });

    function banner(reg) {
      if (document.getElementById("sw-update-bar")) return;
      var bar = document.createElement("div");
      bar.id = "sw-update-bar";
      bar.setAttribute("role", "status");
      bar.style.cssText =
        "position:fixed;left:12px;right:12px;z-index:99999;" +
        "bottom:calc(12px + env(safe-area-inset-bottom));" +
        "display:flex;gap:10px;align-items:center;justify-content:space-between;" +
        "padding:10px 12px;border-radius:12px;font:500 14px/1.3 system-ui,sans-serif;" +
        "background:#1e2027;color:#eaeaf0;box-shadow:0 6px 24px rgba(0,0,0,.45);";
      var msg = document.createElement("span");
      msg.textContent = "A new version is ready.";
      var btn = document.createElement("button");
      btn.textContent = "Reload";
      btn.style.cssText =
        "flex:0 0 auto;border:0;border-radius:9px;padding:8px 14px;" +
        "font:600 14px system-ui,sans-serif;background:#4f7cff;color:#fff;";
      btn.onclick = function () {
        btn.disabled = true;
        if (reg.waiting) reg.waiting.postMessage("skip-waiting");
        else location.reload();
      };
      var dismiss = document.createElement("button");
      dismiss.textContent = "Later";
      dismiss.setAttribute("aria-label", "Dismiss");
      dismiss.style.cssText =
        "flex:0 0 auto;border:0;background:none;color:#9aa0ad;" +
        "font:500 14px system-ui,sans-serif;padding:8px 4px;";
      dismiss.onclick = function () { bar.remove(); };
      bar.appendChild(msg); bar.appendChild(dismiss); bar.appendChild(btn);
      document.body.appendChild(bar);
    }

    /* One reload only. Without the guard, skipWaiting plus controllerchange
       can bounce the page in a loop. */
    var reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloading) return;
      reloading = true;
      location.reload();
    });

    /* ── A DEPLOY HAS TO REACH AN APP THAT IS NEVER CLOSED ──────────────
       Everything above only starts once the browser has NOTICED a new
       sw.js, and it looks for one on navigation. An installed app is
       resumed far more often than it is launched, so it can sit on a
       version for days with nothing on screen saying so.

       That is invisible from the inside and it reads as "the fix you
       shipped does not work". It is worse than cosmetic for anything that
       travels: syncApply skips a collection this build has never heard
       of, by design and correctly, so an old copy quietly drops whatever
       the new version added rather than failing at it. One phone a
       version behind therefore looks exactly like a sync bug.

       So ask whenever the app comes back to the front. reg.update() is a
       conditional request against a file of a few kilobytes: unchanged, it
       is a 304 and nothing happens. Throttled so that flicking between
       apps is not a request each time, and never while offline. */
    var reg = null, lastLook = 0;
    function lookForUpdate() {
      if (!reg || document.visibilityState !== "visible") return;
      if (navigator.onLine === false) return;
      if (Date.now() - lastLook < 60000) return;
      lastLook = Date.now();
      reg.update().catch(function () { /* offline or blocked: the cached app stands */ });
    }
    document.addEventListener("visibilitychange", lookForUpdate);

    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (r) {
        reg = r;
        lastLook = Date.now();          // registering IS this launch's look
        if (reg.waiting && navigator.serviceWorker.controller) banner(reg);
        reg.addEventListener("updatefound", function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener("statechange", function () {
            /* controller set means this is an update, not a first install */
            if (sw.state === "installed" && navigator.serviceWorker.controller) banner(reg);
          });
        });
      }).catch(function (e) {
        console.warn("SW registration failed", e);
      });
    });
  })();
  </script>
</body>
</html>
