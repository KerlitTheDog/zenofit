<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Powerbuild Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">

  <!-- Installing to the home screen is what buys the real portrait lock on
       Android (manifest "orientation": "portrait") and what lets iOS deliver
       timer notifications at all. These tags make that install behave. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#131417">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zenofit">
  <link rel="apple-touch-icon" href="logoC.png">
  <script>
    /* Stamp the saved theme before first paint to avoid a flash of the
       wrong palette. app.js keeps this in sync afterward. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("powerbuild-tracker:v1"));
        var t = s && s.settings && s.settings.theme;
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- Lucide icons (same icon set the JSX prototype used) -->
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
