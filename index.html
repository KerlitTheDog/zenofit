<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Powerbuild Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Stamp the saved theme before first paint to avoid a flash of the
       wrong palette. app.js keeps this in sync afterward. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("powerbuild-tracker:v1"));
        var t = s && s.settings && s.settings.theme;
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- Lucide icons (same icon set the JSX prototype used) -->
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
