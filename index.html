<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- CONTENT SECURITY POLICY. A meta tag because GitHub Pages cannot send
       headers (so frame-ancestors and report-uri, which only work as headers,
       are not here). Scripts come from this origin only: nothing injected
       into a page can run, and there is no inline script anywhere, which is
       why theme.js and sw-register.js are files. Inline STYLES are allowed,
       because the templates put a style attribute on nearly everything.
       It talks to the API (and to a local Worker on port 8787, which is
       what a test points the app at) and frames nothing but YouTube's no-cookie player, for
       the tutorial videos. Any new origin, and any inline script, changes
       this line in the same commit. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://zenofit-api.kerlit.workers.dev http://127.0.0.1:8787 http://localhost:8787; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <!-- viewport-fit=cover lets the app paint under the notch and the home
       indicator; app.js then measures env(safe-area-inset-*) and hands the
       numbers to the layout, so content stays out from under them (see the
       VIEWPORT ENGINE blocks in app.js and styles.css).

       Do not add `interactive-widget=resizes-content` here. It sounds like
       the fix for the save bar sitting under the on-screen keyboard, and on
       Android it is what stops you typing at all: it makes the keyboard
       resize the *layout* viewport, the frame is 100dvh, and every bottom
       sheet is anchored to the frame's bottom, so opening the keyboard
       teleports the field you just tapped ~455px up the screen and Chrome
       gives up on the IME. The default (resizes-visual) lets the keyboard
       overlay the app instead, and nothing moves. If the save bar has to
       clear the keyboard, do it by measuring visualViewport and lifting
       that one bar, not by resizing the whole app out from under a finger. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Zenofit</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Installing to the home screen is what buys the real portrait lock on
       Android (manifest "orientation": "portrait") and what lets iOS deliver
       timer notifications at all. These tags make that install behave. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#131417">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zenofit">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- The saved theme, stamped on <html> before the first paint (theme.js). A
       file of its own rather than inline, because the Content Security Policy
       above lets scripts come from this origin only; still a plain blocking
       script in <head>, so it runs before the body is drawn, as it did. -->
  <script src="theme.js"></script>
</head>
<body>
  <div id="app"></div>
  <!-- Lucide icons (same icon set the JSX prototype used), v0.462.0, served
       from this repo and not from a CDN: a script from another server runs
       with the account token in reach, and this one now cannot change under
       us. lucide.LICENSE.txt is its licence. Another version means that
       version's dist/umd/lucide.min.js from npm, byte for byte. -->
  <script src="lucide.min.js"></script>
  <!-- i18n.js first: app.js calls T() while it renders the first frame.
       standards.js is pure data (the strength-standards tables) and is read
       by the Progress tab's second segment, so it has to be in before app.js
       builds a frame too. -->
  <script src="i18n.js"></script>
  <script src="standards.js"></script>
  <!-- Cloud client. Loaded BEFORE app.js so window.ZenofitCloud exists on the
       first frame. It never touches `state` and fails softly when the API is
       unreachable, so the app runs unchanged without it. -->
  <script src="zenofit-cloud.js"></script>
  <script src="app.js"></script>

  <!-- Service worker. Two reasons it exists: the app opens offline, and
       web push (the only way a timer can ring while the app is closed)
       is delivered to a service worker, not to the page. sw-register.js
       registers it, relays notification clicks and draws the update banner;
       a file of its own because the Content Security Policy allows no
       inline script.

       The update banner is not decoration. sw.js serves from cache
       first, so without it a deploy shows the OLD app on the first open and
       the new one only on the second. Bumping VERSION in sw.js is what makes
       a new worker install; this is what tells the user it is waiting. -->
  <script src="sw-register.js"></script>
</body>
</html>
